<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVMScope — Multichain EVM Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Core */
  --bg:#0b0e14;
  --bg2:#111520;
  --bg3:#161b27;
  --surface:#1a2133;
  --surface2:#1f2840;
  --border:#252f45;
  --border2:#2e3b57;

  /* Text */
  --text:#e8edf8;
  --text2:#a8b5cc;
  --muted:#5a6a85;

  /* Accent */
  --accent:#4f8dff;
  --accent2:#3a73e8;
  --accent-dim:rgba(79,141,255,0.12);
  --accent-glow:rgba(79,141,255,0.25);

  /* Testnet orange */
  --test:#f59e0b;
  --test2:#d97706;
  --test-dim:rgba(245,158,11,0.12);
  --test-glow:rgba(245,158,11,0.2);

  /* Status */
  --green:#10b981;
  --green-dim:rgba(16,185,129,0.12);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,0.12);
  --amber:#f59e0b;
  --amber-dim:rgba(245,158,11,0.12);

  /* Font */
  --mono:'Space Mono',monospace;
  --sans:'Space Grotesk',sans-serif;

  /* Misc */
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 16px rgba(0,0,0,0.5);
  --shadow-glow:0 0 20px rgba(79,141,255,0.15);
}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ── TICKER ── */
.ticker{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 0;overflow:hidden;white-space:nowrap}
.ticker-track{display:inline-flex;gap:28px;animation:scroll-ticker 38s linear infinite;padding:0 20px}
.ticker-track:hover{animation-play-state:paused}
@keyframes scroll-ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--text2);flex-shrink:0}
.ticker-sym{color:var(--text);font-weight:700;font-size:10px}
.ticker-price{color:var(--text)}
.ticker-up{color:var(--green)}
.ticker-dn{color:var(--red)}
.ticker-sep{color:var(--border2)}

/* ── NAV ── */
nav{background:rgba(11,14,20,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:300}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;gap:14px}

.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4f8dff,#7b5ea7);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(79,141,255,0.4)}
.logo-icon svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-text{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-0.5px}
.logo-text span{color:var(--accent)}

/* Mode Toggle */
.mode-toggle{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
.mode-btn{padding:5px 16px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;transition:all 0.2s;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap;color:var(--muted)}
.mode-btn:hover{color:var(--text2)}
.mode-btn.active-main{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow)}
.mode-btn.active-test{background:var(--test);color:#000;box-shadow:0 0 10px var(--test-glow)}

/* Chain tabs */
.chain-tabs-wrap{flex:1;min-width:0;overflow:hidden;position:relative}
.chain-tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:32px;background:linear-gradient(to right,transparent,rgba(11,14,20,0.9));pointer-events:none}
.chain-tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:3px;overflow-x:auto;scrollbar-width:none}
.chain-tabs::-webkit-scrollbar{display:none}
.chain-tab{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;transition:all 0.15s;border:none;background:none;white-space:nowrap;flex-shrink:0;letter-spacing:0.02em}
.chain-tab:hover{color:var(--text2)}
.chain-tab .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.chain-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chain-tab.active-test{background:rgba(245,158,11,0.15);color:var(--test)}

.nav-links{display:flex;gap:1px;flex-shrink:0}
.nav-link{font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;transition:all 0.15s;white-space:nowrap;letter-spacing:0.03em}
.nav-link:hover{color:var(--text);background:var(--surface)}
.nav-link.active{color:var(--accent)}

.nav-end{display:flex;gap:8px;flex-shrink:0;align-items:center}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:var(--sans);letter-spacing:0.02em;white-space:nowrap}
.btn-ghost{border:1px solid var(--border2);color:var(--text2);background:transparent}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-solid{border:1px solid var(--accent);color:#fff;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.btn-solid:hover{background:var(--accent2)}

/* ── MODE BANNER ── */
.mode-banner{display:flex;align-items:center;gap:10px;padding:6px 24px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border-bottom:1px solid}
.mode-banner.main{background:var(--accent-dim);color:var(--accent);border-color:rgba(79,141,255,0.2)}
.mode-banner.test{background:var(--test-dim);color:var(--test);border-color:rgba(245,158,11,0.2)}
.mode-banner .pulse{width:6px;height:6px;border-radius:50%;animation:blink 1.4s infinite}
.mode-banner.main .pulse{background:var(--accent)}
.mode-banner.test .pulse{background:var(--test)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

/* ── SEARCH ── */
.search-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 0}
.search-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:8px;align-items:center}
.search-field{flex:1;max-width:660px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border2);border-radius:9px;height:40px;padding:0 14px;gap:8px;transition:all 0.2s}
.search-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-field svg{width:13px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;flex-shrink:0}
.search-field input{flex:1;border:none;background:none;outline:none;font-size:12px;color:var(--text);font-family:var(--mono)}
.search-field input::placeholder{color:var(--muted);font-family:var(--sans);font-size:12px}
.search-sel{height:40px;padding:0 12px;border:1px solid var(--border2);border-radius:9px;font-size:11px;color:var(--text2);background:var(--surface);cursor:pointer;font-family:var(--sans);outline:none}
.search-sel:focus{border-color:var(--accent)}
.search-go{height:40px;padding:0 20px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all 0.2s}
.search-go:hover{background:var(--accent2)}
.quick-chips{display:flex;gap:6px;align-items:center;flex-shrink:0}
.chip{padding:3px 8px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:10px;font-family:var(--mono);color:var(--muted);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip-label{font-size:10px;color:var(--muted);flex-shrink:0}

/* ── PAGE LAYOUT ── */
.page{max-width:1400px;margin:0 auto;padding:20px 24px;display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.main-col{display:flex;flex-direction:column;gap:14px}
.side-col{display:flex;flex-direction:column;gap:14px}

/* ── STATS STRIP ── */
.stats-strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--border);position:relative;overflow:hidden}
.stat:last-child{border-right:none}
.stat::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.stat.accent::before{background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.stat.test-accent::before{background:linear-gradient(90deg,transparent,var(--test),transparent)}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:500;margin-bottom:6px}
.stat-val{font-size:21px;font-weight:700;letter-spacing:-0.5px;line-height:1;margin-bottom:4px;color:var(--text)}
.stat-sub{font-size:10px;font-family:var(--mono)}
.green{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)} .blue{color:var(--accent)} .muted{color:var(--muted)} .test-color{color:var(--test)}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card.accent-top{border-top:2px solid var(--accent)}
.card.test-top{border-top:2px solid var(--test)}
.card-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text)}
.card-more{font-size:11px;color:var(--accent);text-decoration:none;font-weight:500;opacity:0.8}
.card-more:hover{opacity:1;text-decoration:underline}

/* ── TABS ── */
.tab-bar{display:flex;border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-item{padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all 0.15s;white-space:nowrap;flex-shrink:0;letter-spacing:0.02em}
.tab-item:hover{color:var(--text2)}
.tab-item.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-item.active-test{color:var(--test);border-bottom-color:var(--test)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:10px 16px;text-align:left;background:var(--bg);border-bottom:1px solid var(--border)}
.tbl td{padding:10px 16px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle;transition:background 0.1s}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,0.025)}
.tbl-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}

.hash-link{font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer;text-decoration:none;transition:color 0.1s}
.hash-link:hover{color:#7ab0ff;text-decoration:underline}
.addr-text{font-family:var(--mono);font-size:11px;color:var(--text2)}
.addr-text b{color:var(--text)}
.mono-sm{font-family:var(--mono);font-size:11px;color:var(--text2)}
.mono-green{font-family:var(--mono);font-size:11px;color:var(--green);font-weight:700}
.mono-muted{font-family:var(--mono);font-size:11px;color:var(--muted)}
.t-xs{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.03em;white-space:nowrap}
.b-green{background:var(--green-dim);color:var(--green)}
.b-red{background:var(--red-dim);color:var(--red)}
.b-amber{background:var(--amber-dim);color:var(--amber)}
.b-blue{background:var(--accent-dim);color:var(--accent)}
.b-test{background:var(--test-dim);color:var(--test)}
.b-gray{background:rgba(255,255,255,0.06);color:var(--muted)}
.b-purple{background:rgba(139,92,246,0.15);color:#a78bfa}
.b-pink{background:rgba(236,72,153,0.12);color:#f472b6}

/* ── CHAIN INFO GRID ── */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.info-cell{background:var(--bg2);padding:14px 18px}
.info-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:500;margin-bottom:5px}
.info-val{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.info-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:3px}

/* ── MINI CHART ── */
.mini-chart-wrap{padding:14px 18px 14px}
.chart-title{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.chart-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:4px}

/* ── BLOCK LIST ── */
.block-list{display:flex;flex-direction:column}
.block-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--border);transition:background 0.1s}
.block-item:last-child{border-bottom:none}
.block-item:hover{background:rgba(255,255,255,0.025)}
.block-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.block-icon.main-icon{background:var(--accent-dim);border:1px solid rgba(79,141,255,0.2)}
.block-icon.test-icon{background:var(--test-dim);border:1px solid rgba(245,158,11,0.2)}
.block-body{flex:1;min-width:0}
.block-num-link{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);display:block;cursor:pointer}
.block-num-link:hover{text-decoration:underline}
.block-meta{font-size:10px;color:var(--muted);margin-top:2px}
.block-right{text-align:right;flex-shrink:0}
.block-txs{font-size:12px;font-weight:600;color:var(--text)}
.block-age{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}

/* ── VALIDATORS ── */
.val-list{display:flex;flex-direction:column}
.val-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background 0.1s}
.val-item:last-child{border-bottom:none}
.val-item:hover{background:rgba(255,255,255,0.025)}
.val-rank{width:20px;font-size:10px;font-family:var(--mono);color:var(--muted);text-align:center;flex-shrink:0}
.val-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.val-body{flex:1;min-width:0}
.val-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val-comm{font-size:10px;color:var(--muted);margin-top:1px}
.val-right{text-align:right;flex-shrink:0}
.val-pct{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--text)}
.val-bar-bg{width:64px;height:3px;background:var(--surface2);border-radius:2px;margin-top:5px;margin-left:auto}
.val-bar-fill{height:3px;border-radius:2px}

/* ── SIDE CHAIN LIST ── */
.chain-list-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.chain-list-item:last-child{border-bottom:none}
.chain-list-item:hover{background:rgba(255,255,255,0.03)}
.chain-list-item.active-item{background:var(--accent-dim)}
.chain-list-item.active-test-item{background:var(--test-dim)}
.chain-badge-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.chain-list-name{font-size:12px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain-list-block{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.chain-list-status{text-align:right;flex-shrink:0}
.chain-list-gas{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:1px;text-align:right}

/* ── PRICE CARD ── */
.price-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background 0.1s}
.price-item:last-child{border-bottom:none}
.price-item:hover{background:rgba(255,255,255,0.025)}
.token-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.token-name{font-size:12px;font-weight:600}
.token-sym{font-size:10px;font-family:var(--mono);color:var(--muted)}
.token-price{font-size:12px;font-weight:700;font-family:var(--mono);text-align:right}
.token-chg{font-size:10px;font-family:var(--mono);text-align:right;margin-top:1px}

/* ── FAUCET ── */
.faucet-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--surface);border-radius:7px;border:1px solid var(--border)}
.faucet-name{font-size:12px;font-weight:600}
.faucet-sym{font-size:10px;font-family:var(--mono);color:var(--muted)}
.faucet-btn{padding:4px 12px;border:1px solid var(--test);border-radius:5px;color:var(--test);font-size:11px;font-weight:600;text-decoration:none;transition:all 0.15s;font-family:var(--sans)}
.faucet-btn:hover{background:var(--test);color:#000}

/* ── TESTNET ALERT ── */
.testnet-alert{background:var(--test-dim);border:1px solid rgba(245,158,11,0.25);border-radius:9px;padding:11px 16px;font-size:12px;color:var(--test);display:flex;align-items:center;gap:9px;font-weight:500}

/* ── LIVE PILL ── */
.live-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--green);background:var(--green-dim);border:1px solid rgba(16,185,129,0.2);border-radius:100px;padding:2px 8px;letter-spacing:0.04em}
.live-dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:blink 1.4s infinite}
.test-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--test);background:var(--test-dim);border:1px solid rgba(245,158,11,0.25);border-radius:100px;padding:2px 8px;letter-spacing:0.06em}

/* ── FOOTER ── */
footer{border-top:1px solid var(--border);background:var(--bg2);margin-top:32px}
.footer-inner{max-width:1400px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.footer-logo{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--text2)}
.footer-links{display:flex;gap:18px}
.footer-links a{color:var(--muted);text-decoration:none}
.footer-links a:hover{color:var(--accent)}

/* ── RESPONSIVE ── */
@media(max-width:1020px){.page{grid-template-columns:1fr}.side-col{display:none}.stats-strip{grid-template-columns:repeat(3,1fr)}.nav-links{display:none}}
@media(max-width:640px){.stats-strip{grid-template-columns:repeat(2,1fr)}.search-inner{flex-wrap:wrap}.quick-chips{display:none}}
</style>
</head>
<body>

<!-- ══ TICKER ══ -->
<div class="ticker">
  <div class="ticker-track" id="tickerTrack">
    <!-- filled twice for seamless loop -->
  </div>
</div>

<!-- ══ NAV ══ -->
<nav>
  <div class="nav-inner">

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-main').className = 'mode-btn' + (mode==='main' ? ' active-main' : '');
  document.getElementById('btn-test').className = 'mode-btn' + (mode==='test' ? ' active-test' : '');

  const banner = document.getElementById('modeBanner');
  banner.className = 'mode-banner ' + mode;
  document.getElementById('bannerText').textContent = mode === 'main'
    ? '● EVM Mainnet — Live production chains · Real assets'
    : '⚠ EVM Testnet — Test tokens only · No real value';

  currentChainId = CHAINS[mode][0].id;
  renderChainTabs();
  renderSearchSel();
  renderPage();
}

function renderChainTabs() {
  const bar = document.getElementById('chainTabsBar');
  bar.innerHTML = CHAINS[currentMode].map(c => {
    const isActive = c.id === currentChainId;
    const cls = isActive
      ? (currentMode === 'test' ? 'chain-tab active-test' : 'chain-tab active')
      : 'chain-tab';
    return `<button class="${cls}" onclick="switchChain('${c.id}')">
      <span class="dot" style="background:${c.dot}"></span>${c.name}
    </button>`;
  }).join('');
}

function switchChain(id) {
  currentChainId = id;
  renderChainTabs();
  renderPage();
}

function renderSearchSel() {
  const sel = document.getElementById('searchSel');
  sel.innerHTML = '<option>All Networks</option>' +
    CHAINS[currentMode].map(c => `<option value="${c.id}">${c.name} (${c.chainId})</option>`).join('');
}

function fillSearch(v) { document.getElementById('searchInput').value = v; }

  document.getElementById('mainCol').innerHTML = buildMain(chain);
  document.getElementById('sideCol').innerHTML = buildSide(chain);
}

function getChain() {
  return CHAINS[currentMode].find(c => c.id === currentChainId);
}

function showTab(el, paneId) {
  const bar = el.closest('.tab-bar');
  const card = bar.closest('.card');
  const isTest = currentMode === 'test';
  bar.querySelectorAll('.tab-item').forEach(t => t.className = 'tab-item');
  el.className = 'tab-item ' + (isTest ? 'active-test' : 'active');
  ['tab-txs','tab-blks','tab-tokens','tab-internal'].forEach(id => {
    const p = card.querySelector('#'+id);
    if(p) p.style.display = id === paneId ? '' : 'none';
  });
}

function buildSparkPath(c) {
  // Generate deterministic-ish points based on chain id
  const seed = c.id.split('').reduce((a,ch) => a + ch.charCodeAt(0), 0);
  const pts = Array.from({length:31}, (_,i) => {
    const v = 10 + ((seed * (i+1) * 37 + i * 13) % 32);
    return {x: i * 28, y: 50 - v};
  });
  const pStr = pts.map((p,i) => (i===0?'M':'')+`${p.x},${p.y}`).join(' L');
  const aStr = pStr + ` L${pts[pts.length-1].x},52 L0,52 Z`;
  return `
    <path d="${aStr}" fill="url(#grd${c.id})"/>
    <path d="${pStr}" fill="none" stroke="${c.dot}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  `;
}

/* ── INTERNAL TXS ── */
function buildInternalTxTable(c) {
  const blkBase = parseInt(c.block.replace(/,/g,''));
  const types = ['CALL','DELEGATECALL','CREATE','STATICCALL','CREATE2'];
  const rows = Array.from({length:6}, (_,i) => ({
    parent: `0x${(i*17+3).toString(16).padStart(4,'0')}…${(i*31+9).toString(16).padStart(4,'0')}`,
    type: types[i % types.length],
    from: `0x${(i*7+1).toString(16).padStart(4,'0')}…`,
    to: i===0 ? 'New Contract' : `0x${(i*11+5).toString(16).padStart(4,'0')}…`,
    val: i===1||i===4 ? `${(i*0.25).toFixed(3)} ${c.sym}` : `0.000 ${c.sym}`,
    blk: (blkBase - i).toLocaleString(),
  }));
  const typeCls = {CALL:'b-blue',DELEGATECALL:'b-purple',CREATE:'b-green',STATICCALL:'b-gray',CREATE2:'b-pink'};
  return `<div style="overflow-x:auto">
  <table class="tbl">
    <thead><tr><th>Parent Tx</th><th>Type</th><th>Block</th><th>From</th><th>To</th><th>Value</th></tr></thead>
    <tbody>
    ${rows.map(r => `<tr>

}

// Block height live counter
setInterval(() => {
  const c = getChain();
  if(!c) return;
  const bps = 1 / parseFloat(c.blockTime);
  if(!blockCounters[c.id]) blockCounters[c.id] = parseInt(c.block.replace(/,/g,''));

}, 1000);

  const rows = document.querySelectorAll('.tbl tbody tr');

      ? 'rgba(245,158,11,0.06)' : 'rgba(79,141,255,0.07)';
